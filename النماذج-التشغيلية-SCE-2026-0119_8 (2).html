<title>سجل النماذج التشغيلية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#EDF1F4; --surface:#FFFFFF; --surface-2:#F6F9FB;
  --ink:#0F1F2B; --ink-2:#3E5567; --ink-3:#6F8799; --ink-4:#9DB0BE;
  --line:#D4DFE7; --line-soft:#E6EDF2;
  --brand:#1E5578; --brand-deep:#123A52; --brand-soft:#E4EEF5;
  --brass:#A8762B; --brass-soft:#F7EFE0;
  --ok:#1B6E53; --ok-soft:#E2F1EB;
  --warn:#8F6412; --warn-soft:#FAEFDA;
  --crit:#A33127; --crit-soft:#FAE6E3;
  --sans:"IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  --disp:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --sh:0 1px 2px rgba(16,40,58,.05),0 12px 30px -22px rgba(16,40,58,.5);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#08121A; --surface:#0E1C26; --surface-2:#122430;
  --ink:#E2ECF3; --ink-2:#AFC3D1; --ink-3:#8399A9; --ink-4:#5D7383;
  --line:#213340; --line-soft:#192932;
  --brand:#5FA3CE; --brand-deep:#8FC3E5; --brand-soft:#122A3A;
  --brass:#CFA457; --brass-soft:#2A2312;
  --ok:#4FB58C; --ok-soft:#112C23; --warn:#C99A34; --warn-soft:#2C2413;
  --crit:#D9786C; --crit-soft:#2E1815;
}}
:root[data-theme="dark"]{
  --ground:#08121A; --surface:#0E1C26; --surface-2:#122430;
  --ink:#E2ECF3; --ink-2:#AFC3D1; --ink-3:#8399A9; --ink-4:#5D7383;
  --line:#213340; --line-soft:#192932;
  --brand:#5FA3CE; --brand-deep:#8FC3E5; --brand-soft:#122A3A;
  --brass:#CFA457; --brass-soft:#2A2312;
  --ok:#4FB58C; --ok-soft:#112C23; --warn:#C99A34; --warn-soft:#2C2413;
  --crit:#D9786C; --crit-soft:#2E1815;
}
*{box-sizing:border-box}
body{margin:0;direction:rtl;background:var(--ground);color:var(--ink);
  font-family:var(--sans);font-size:14px;line-height:1.7;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--disp);text-wrap:balance;margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ===== شريط علوي ===== */
.top{position:sticky;top:0;z-index:60;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:9px clamp(14px,3vw,30px);flex-wrap:wrap}
.top .logos{display:flex;align-items:center;gap:10px}
.top .logos img{height:30px;width:auto}
.top .logos .bar{width:1px;height:24px;background:var(--line)}
.top .ttl{font-family:var(--disp);font-weight:600;font-size:14.5px;letter-spacing:-.01em}
.top .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:7px;padding:6px 12px;font-size:12.5px;font-weight:500;color:var(--ink-2);cursor:pointer}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-deep);border-color:var(--brand-deep);color:#fff}
.btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.chipsave{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);font-family:var(--mono)}
.chipsave i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:block}
.chipsave.off i{background:var(--ink-4)} .chipsave.busy i{background:var(--warn)}

/* ===== الغلاف ===== */
.wrap{max-width:1180px;margin:0 auto;padding-block:26px 70px;padding-inline:clamp(16px,3vw,28px)}

/* ===== ترويسة الفهرس ===== */
.mast{display:grid;grid-template-columns:1fr auto;gap:22px;align-items:end;
  border-bottom:2px solid var(--brand);padding-bottom:16px;margin-bottom:22px}
.mast .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--brass);margin-bottom:8px}
.mast h1{font-size:clamp(23px,3.6vw,32px);font-weight:600;letter-spacing:-.02em;line-height:1.25}
.mast p{margin:9px 0 0;color:var(--ink-2);max-width:62ch;font-size:13.5px}
.mast .meta{text-align:end;font-family:var(--mono);font-size:11.5px;color:var(--ink-3);line-height:2}
.mast .meta b{color:var(--ink);font-weight:600}
@media(max-width:760px){.mast{grid-template-columns:1fr}.mast .meta{text-align:start}}

/* ===== مرجع أزمنة الخدمة ===== */
.sla{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:26px;box-shadow:var(--sh)}
.sla .h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-soft);background:var(--surface-2)}
.sla .h b{font-family:var(--disp);font-size:13px;font-weight:600}
.sla .h span{font-size:11.5px;color:var(--ink-3)}
.slagrid{display:grid;grid-template-columns:repeat(4,1fr)}
.slacell{padding:11px 14px;border-inline-start:1px solid var(--line-soft)}
.slacell:first-child{border-inline-start:none}
.slacell .k{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;margin-bottom:6px}
.slacell .k i{width:8px;height:8px;border-radius:2px;display:block}
.slacell dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:11.5px}
.slacell dt{color:var(--ink-3)} .slacell dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums}
@media(max-width:820px){.slagrid{grid-template-columns:repeat(2,1fr)}.slacell:nth-child(3){border-inline-start:none}}
@media(max-width:470px){.slagrid{grid-template-columns:1fr}.slacell{border-inline-start:none;border-top:1px solid var(--line-soft)}}

/* ===== أشرطة المرفقات ===== */
.band{margin-bottom:26px}
.bandhead{display:flex;align-items:flex-start;gap:14px;padding-inline-start:14px;
  border-inline-start:3px solid var(--brass);margin-bottom:10px}
.bandhead .no{font-family:var(--mono);font-size:11px;color:var(--brass);letter-spacing:.1em;display:block;margin-bottom:2px}
.bandhead h2{font-size:17px;font-weight:600;letter-spacing:-.01em}
.bandhead .sub{font-size:12px;color:var(--ink-3);margin-top:3px}
.bandhead .sp{flex:1}
.stds{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;max-width:330px}
.std{font-family:var(--mono);font-size:10px;padding:2.5px 7px;border-radius:4px;
  background:var(--brass-soft);color:var(--brass);white-space:nowrap}
@media(max-width:700px){.bandhead{flex-wrap:wrap}.stds{justify-content:flex-start;max-width:none}}

.rows{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--sh)}
.row{display:grid;grid-template-columns:76px 1fr 150px 150px 78px 34px;gap:12px;align-items:center;
  padding:11px 14px;border-top:1px solid var(--line-soft);cursor:pointer;background:none;border-inline:none;
  border-bottom:none;width:100%;text-align:start;font:inherit;color:inherit}
.row:first-child{border-top:none}
.row:hover{background:var(--brand-soft)}
.row:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.row .code{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--brand);
  background:var(--brand-soft);border-radius:5px;padding:3px 0;text-align:center}
.row .nm{min-width:0}
.row .nm b{display:block;font-weight:600;font-size:13.5px;line-height:1.45}
.row .nm span{display:block;font-size:11px;color:var(--ink-4);font-family:var(--mono);letter-spacing:.01em}
.row .cls,.row .own{font-size:11.5px;color:var(--ink-3)}
.row .cnt{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);text-align:center}
.row .cnt b{color:var(--ok);font-weight:600}
.row .go{color:var(--ink-4);font-size:15px;text-align:center}
.row:hover .go{color:var(--brand)}
@media(max-width:860px){
  .row{grid-template-columns:70px 1fr 60px;gap:10px}
  .row .cls,.row .own{display:none}
}

/* ===== ورقة النموذج ===== */
.sheetbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.sheetbar .sp{flex:1}
.recpick{border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:12.5px;
  background:var(--surface);max-width:290px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);overflow:hidden}
.lethead{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;
  padding:16px 20px;border-bottom:2px solid var(--brand);background:var(--surface-2)}
.lethead img{height:44px;width:auto}
.lethead .mid{text-align:center;min-width:0}
.lethead .mid h2{font-size:16.5px;font-weight:600;letter-spacing:-.01em}
.lethead .mid .en{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:3px;letter-spacing:.03em}
@media(max-width:620px){.lethead{grid-template-columns:1fr;justify-items:center;gap:10px}}

.refbar{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line-soft)}
.refbar div{padding:8px 14px;border-inline-start:1px solid var(--line-soft);font-size:11.5px}
.refbar div:first-child{border-inline-start:none}
.refbar span{display:block;color:var(--ink-4);font-size:10px;letter-spacing:.05em}
.refbar b{font-family:var(--mono);font-weight:600;font-size:12px}
@media(max-width:700px){.refbar{grid-template-columns:repeat(2,1fr)}.refbar div:nth-child(3){border-inline-start:none}}

.stdline{padding:9px 20px;background:var(--brass-soft);border-bottom:1px solid var(--line-soft);
  display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:11.5px;color:var(--brass)}
.stdline b{font-family:var(--disp);font-weight:600;font-size:11.5px}

.body{padding:18px 20px 26px}
.sec{margin-bottom:22px}
.sec:last-child{margin-bottom:0}
.sec>h3{font-size:13px;font-weight:600;color:var(--brand);padding-bottom:6px;margin-bottom:12px;
  border-bottom:1.5px solid var(--line);display:flex;align-items:baseline;gap:8px}
.sec>h3 em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--ink-4);letter-spacing:.06em;text-transform:uppercase}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.grid.g1{grid-template-columns:1fr}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:11.5px;color:var(--ink-2);font-weight:500}
.f .hint{font-size:10.5px;color:var(--ink-4)}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;border:1px solid var(--line);border-radius:7px;background:var(--surface);
  padding:7px 10px;font-size:13px;color:var(--ink)}
textarea{min-height:76px;resize:vertical;line-height:1.7}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 15%,transparent)}
input::placeholder,textarea::placeholder{color:var(--ink-4)}

.chkg{display:flex;flex-wrap:wrap;gap:7px}
.chkg label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;
  padding:5px 11px;font-size:12px;cursor:pointer;background:var(--surface)}
.chkg label:has(input:checked){border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:500}
.chkg input{accent-color:var(--brand)}
.one{display:inline-flex;align-items:center;gap:7px;font-size:12.5px}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:9px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:var(--surface-2);color:var(--ink-2);font-weight:600;font-size:11px;text-align:start;
  padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.01em}
td{padding:5px 7px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
td input,td select,td textarea{border-color:transparent;background:transparent;border-radius:5px;padding:5px 7px;font-size:12.5px}
td input:hover,td select:hover,td textarea:hover{border-color:var(--line)}
td textarea{min-height:34px}
.delrow{border:none;background:none;color:var(--ink-4);cursor:pointer;font-size:15px;line-height:1;padding:3px 6px}
.delrow:hover{color:var(--crit)}
.addrow{margin-top:8px}
.addx{border:1px dashed var(--line);background:none;border-radius:7px;padding:5px 12px;font-size:12px;
  color:var(--ink-3);cursor:pointer}
.addx:hover{border-color:var(--brand);color:var(--brand)}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:3px 10px;
  font-size:11px;font-weight:600;font-family:var(--mono)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-crit{background:var(--crit-soft);color:var(--crit)}
.p-none{background:var(--line-soft);color:var(--ink-3)}
.p-br{background:var(--brand-soft);color:var(--brand)}

.calc{display:flex;flex-wrap:wrap;gap:10px;background:var(--surface-2);border:1px solid var(--line-soft);
  border-radius:9px;padding:11px 13px;align-items:center}
.calc .cell{display:flex;flex-direction:column;gap:2px;min-width:120px}
.calc .cell span{font-size:10.5px;color:var(--ink-4)}
.calc .cell b{font-family:var(--mono);font-size:13px;font-weight:600}

.sig{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:26px;padding-top:16px;border-top:1.5px solid var(--line)}
.sigbox .role{font-size:11px;color:var(--ink-4);letter-spacing:.05em;margin-bottom:7px}
.sigbox .ln{border-bottom:1px dotted var(--ink-4);height:22px;margin-bottom:5px}
.sigbox .cap{font-size:10.5px;color:var(--ink-4)}
@media(max-width:620px){.sig{grid-template-columns:1fr}}

.note{font-size:11.5px;color:var(--ink-3);background:var(--surface-2);border:1px solid var(--line-soft);
  border-inline-start:3px solid var(--brand);border-radius:7px;padding:9px 12px}

.empty{text-align:center;padding:40px 20px;color:var(--ink-3);font-size:13px}

@media print{
  .top,.sheetbar,.addx,.delrow,.crumb,.tmbtn{display:none!important}
  .sec{border:none;padding-inline-start:0}
  .sec>h3::before{display:none}
  body{background:#fff}
  .wrap{padding:0;max-width:none}
  .sheet{border:none;border-radius:0;box-shadow:none}
  .tw{border-color:#ccc}
  input,select,textarea{border-color:#ddd!important}
}
html[lang="en"] body{direction:ltr}
html[lang="en"] .mono,html[lang="en"] .row .code{letter-spacing:.02em}

/* ===== المؤقت ===== */
.timerbox{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface-2)}
.tmhead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:13px 16px;
  border-bottom:1px solid var(--line-soft);background:var(--surface)}
.tmbig{display:flex;flex-direction:column;gap:1px;min-width:200px}
.tmlab{font-size:10.5px;color:var(--ink-4);letter-spacing:.05em}
.tmclock{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1.1;
  font-variant-numeric:tabular-nums;color:var(--brand)}
.tmclock.over{color:var(--crit)} .tmclock.done{color:var(--ok)}
.tmsub{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.tmside{margin-inline-start:auto;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.tmrun::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;
  display:inline-block;margin-inline-end:5px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.tmrun::before{animation:none}}
.tmsteps{padding:6px 16px 14px}
.tmrow{display:grid;grid-template-columns:190px 1fr 150px 190px;gap:12px;align-items:center;
  padding:9px 0;border-bottom:1px dashed var(--line-soft)}
.tmrow:last-child{border-bottom:none}
.tmname{font-size:12.5px;font-weight:500}
.tmname em{display:block;font-style:normal;font-size:10.5px;color:var(--ink-4);font-family:var(--mono)}
.tmbar{height:7px;border-radius:4px;background:var(--line-soft);overflow:hidden}
.tmbar i{display:block;height:100%;border-radius:4px;transition:width .4s ease}
.b-ok{background:var(--ok)} .b-crit{background:var(--crit)} .b-warn{background:var(--warn)}
.b-br{background:var(--brand)} .b-none{background:var(--ink-4)}
.tmval{text-align:center}
.tmstamp{display:flex;gap:6px;align-items:center;justify-content:flex-end;font-size:11px}
.tmbtn{border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:7px;
  padding:5px 13px;font-size:12px;font-weight:600;cursor:pointer}
.tmbtn:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
.tmbtn[disabled]{opacity:.4;cursor:not-allowed}
.tmbtn.undo{background:none;color:var(--ink-4);border-color:var(--line);padding:4px 9px;font-weight:400}
.tmbtn.undo:hover{color:var(--crit);border-color:var(--crit)}
@media(max-width:820px){.tmrow{grid-template-columns:1fr 1fr;gap:8px}
  .tmbar{grid-column:1/-1}.tmstamp{justify-content:flex-start}}

/* ===== لوحة المتابعة ===== */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:11px;margin-bottom:20px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  display:flex;flex-direction:column;gap:2px;box-shadow:var(--sh);border-top:3px solid var(--line)}
.tile.warn{border-top-color:var(--warn)} .tile.crit{border-top-color:var(--crit)}
.tile .tl{font-size:11px;color:var(--ink-3)}
.tile .tv{font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.25;font-variant-numeric:tabular-nums}
.tile .ts{font-size:10.5px;color:var(--ink-4)}
.dgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:14px 16px 16px;box-shadow:var(--sh)}
.panel.wide{grid-column:1/-1}
.panel h3{font-size:13px;font-weight:600;color:var(--brand);display:flex;align-items:baseline;gap:8px;
  padding-bottom:8px;margin-bottom:12px;border-bottom:1.5px solid var(--line)}
.panel h3 span{margin-inline-start:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-4);font-weight:400}
.pnote{margin:12px 0 0;font-size:10.5px;color:var(--ink-4);line-height:1.6}
.hbars{display:flex;flex-direction:column;gap:9px}
.hrow{display:grid;grid-template-columns:110px 1fr 46px;gap:10px;align-items:center;font-size:12px}
.hlab{color:var(--ink-2)}
.htrack{height:10px;border-radius:5px;background:var(--line-soft);overflow:hidden}
.htrack i{display:block;height:100%;border-radius:5px;min-width:2px}
.hval{text-align:end;color:var(--ink-2);font-size:12px}
.heatwrap{display:grid;grid-template-columns:auto 1fr;gap:6px;align-items:center}
.hyl{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10.5px;color:var(--ink-4);text-align:center}
.hxl{text-align:center;font-size:10.5px;color:var(--ink-4);margin-top:6px}
.hgrid{display:grid;grid-template-columns:22px repeat(5,1fr);gap:4px;align-items:center}
.hax{font-family:var(--mono);font-size:10px;color:var(--ink-4);text-align:center}
.hax.b{color:var(--ink-3)}
.hcell{display:flex;align-items:center;justify-content:center;height:32px;border-radius:5px;
  font-family:var(--mono);font-size:12.5px;font-weight:600;color:#fff;
  box-shadow:inset 0 0 0 2px var(--surface)}
.hcell.zero{opacity:.28}
.c-ok{background:var(--ok)} .c-br{background:var(--brand)} .c-warn{background:var(--warn)} .c-crit{background:var(--crit)}
.c-none{background:var(--ink-4)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:11px;justify-content:center;font-size:11px;color:var(--ink-3)}

/* ===== مسار الاعتماد ===== */
.wfbar{border-bottom:1px solid var(--line-soft);background:var(--surface-2)}

.wfhead .sp{flex:1}

.wstep.done,.wstep.on{opacity:1}
.wdot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-family:var(--mono);background:var(--line-soft);color:var(--ink-3);flex:none}
.wstep.done .wdot{background:var(--ok);color:#fff}

.wtxt em{display:block;font-style:normal;font-size:9.5px;color:var(--ink-4);font-family:var(--mono);white-space:nowrap;max-width:135px;overflow:hidden;text-overflow:ellipsis}
.wsep{width:18px;height:2px;background:var(--line);flex:none}

function toMin(t){ if(!t||!/^\d{1,2}:\d{2}/.test(t)) return null; const [h,m]=t.split(":").map(Number); return h*60+m; }
function diffMin(a,b){ const x=toMin(a), y=toMin(b); if(x===null||y===null) return null; let d=y-x; if(d<0) d+=1440; return d; }
function fmtMin(d){ if(d===null) return "—"; const h=Math.floor(d/60), m=d%60; return h?`${h} ${U("hh")} ${m} ${U("mm")}`:`${m} ${U("min")}`; }
function riskLevel(sc){
  if(!sc) return {t:"—", c:"p-none"};
  const L=a=>LANG==="en"?RISK_EN[a]:a;
  if(sc>=15) return {t:L("حرج"), c:"p-crit"};
  if(sc>=9)  return {t:L("عالٍ"), c:"p-warn"};
  if(sc>=4)  return {t:L("متوسط"), c:"p-br"};
  return {t:L("منخفض"), c:"p-ok"};
}

/* ===================== لوحة المؤقت ===================== */
function timerBox(f,r){
  const T=f.timer; if(!T) return "";
  ensureTs(f,r);
  const started=r.ts&&r.ts[T.start];
  const done=r.ts&&r.ts[T.steps[T.steps.length-1].k];
  const cls=r.v.cls, s=SLA[cls];
  const live=elapsedMs(r,T.start, done?T.steps[T.steps.length-1].k:null);

  const head=`<div class="tmhead">
    <div class="tmbig">
      <span class="tmlab">${done?U("totalDur"):U("sinceReg")}</span>
      <b class="tmclock ${done?"done":(overallBreach(r,T,s)?"over":"")}" data-tick="${T.start}" data-to="${done?T.steps[T.steps.length-1].k:""}">${fmtDur(live)}</b>
      <span class="tmsub">${U("regAt")} ${esc(fmtStamp(started))}</span>
    </div>
    <div class="tmside">
      ${f.sla?`<span class="pill ${cls?("p-"+({"طارئ":"crit","عالي":"warn","متوسط":"br","منخفض":"none"}[cls]||"none")):"p-none"}">${cls?esc(slaName(cls)):U("pickCls")}</span>`:""}
      ${done?`<span class="pill p-ok">${U("closedAt")} ${esc(fmtStamp(r.ts[T.steps[T.steps.length-1].k]))}</span>`:`<span class="pill p-br tmrun">${U("running")}</span>`}
      <button class="tmbtn undo" data-resetts title="${U("resetTs")}">${U("resetTs")}</button>
    </div></div>`;

  const rows=T.steps.map(st=>{
    const stamped=r.ts&&r.ts[st.k];
    const el=stamped?elapsedMs(r,T.start,st.k):elapsedMs(r,T.start);
    const target=(f.sla&&s&&st.sla)?s[st.sla]*60000:null;
    let pct=0, state="p-none", txt="—";
    if(target!==null && el!==null){
      pct=Math.min(100, Math.round(el/Math.max(target,1)*100));
      if(target===0){ state="p-br"; txt=U("gap")+" "+fmtDur(el); }
      else if(el<=target){ state="p-ok"; txt=(stamped?U("ok"):U("left")+" "+fmtDur(target-el)); }
      else { state="p-crit"; txt=U("over")+" "+fmtDur(el-target); }
    } else if(el!==null){ state=stamped?"p-ok":"p-br"; txt=stamped?U("done2"):U("running"); pct=stamped?100:0; }
    return `<div class="tmrow">
      <div class="tmname">${esc(pick(st.l,st.en))}${target!==null?`<em>${U("tgt")} ${esc(slaLbl(cls,st.sla+"L"))}</em>`:""}</div>
      <div class="tmbar"><i style="width:${stamped?Math.min(pct,100):Math.min(pct,100)}%" class="${state.replace("p-","b-")}"></i></div>
      <div class="tmval"><span class="pill ${state}" ${stamped?"":`data-tickrow="${st.k}"`}>${esc(txt)}</span></div>
      <div class="tmstamp">${stamped?`<span class="mono">${esc(fmtStamp(stamped))}</span>
          <button class="tmbtn undo" data-unstamp="${st.k}" data-fld="${st.field||""}" title="${U("undo")}">↺</button>`
        :`<button class="tmbtn go" data-stamp="${st.k}" data-fld="${st.field||""}">${U("stamp")}</button>`}</div>
    </div>`;
  }).join("");

  return `<div class="timerbox">${head}<div class="tmsteps">${rows}</div>
  </div>`;
}
function overallBreach(r,T,s){
  if(!s) return false;
  const last=T.steps[T.steps.length-1];
  if(!last.sla) return false;
  const el=elapsedMs(r,T.start, r.ts&&r.ts[last.k]?last.k:null);
  return el!==null && el>s[last.sla]*60000;
}
/* تحديث حي كل ثانية دون إعادة بناء الصفحة */
let tickTimer=null;
function startTicking(){
  clearInterval(tickTimer);
  tickTimer=setInterval(()=>{
    const c=cur(); if(!c||!c.r||!c.f.timer) return;
    const {f,r}=c, T=f.timer;
    const last=T.steps[T.steps.length-1];
    const done=r.ts&&r.ts[last.k];
    const cl=document.querySelector(".tmclock");
    if(cl) cl.textContent=fmtDur(elapsedMs(r,T.start, done?last.k:null));
    if(done) return;
    const s=SLA[r.v.cls];
    document.querySelectorAll("[data-tickrow]").forEach(el=>{
      const k=el.dataset.tickrow, st=T.steps.find(x=>x.k===k); if(!st) return;
      const ms=elapsedMs(r,T.start); if(ms===null) return;
      const target=(f.sla&&s&&st.sla)?s[st.sla]*60000:null;
      if(target===null){ el.textContent=U("running"); return; }
      if(target===0){ el.className="pill p-br"; el.textContent=U("gap")+" "+fmtDur(ms); }
      else if(ms<=target){ el.className="pill p-ok"; el.textContent=U("left")+" "+fmtDur(target-ms); }
      else { el.className="pill p-crit"; el.textContent=U("over")+" "+fmtDur(ms-target); }
      const bar=el.closest(".tmrow").querySelector(".tmbar i");
      if(bar){ bar.style.width=Math.min(100,Math.round(ms/Math.max(target,1)*100))+"%";
               bar.className = target===0?"b-br":(ms<=target?"b-ok":"b-crit"); }
    });
  },1000);
}

function newRec(code){
  const f=F(code), now=new Date();
  const r={id:uid("r"), at:now.toISOString(), v:{}, ts:{}};
  f.secs.forEach(s=>(s.f||[]).forEach(fl=>{
    if(fl.t==="rows"){
      r.v[fl.k] = fl.seedRows ? fl.seedRows.map(row=>[...row])
                              : Array.from({length:fl.seed||2},()=>fl.cols.map(()=>""));
    }
  }));
  if(f.timer){                                   /* ختم وقت الإنشاء تلقائيًا */
    r.ts[f.timer.start]=now.toISOString();
    r.v[f.timer.dateField]=isoDate(now);

/* ===================== محرك المؤقت ===================== */
const pad=n=>String(n).padStart(2,"0");
const isoDate=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const isoTime=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
function tsFromFields(r,T){
  const d=r.v[T.dateField], t=r.v[T.timeField];
  if(d&&t){ const x=new Date(d+"T"+String(t).slice(0,5)+":00"); if(!isNaN(x)) return x.toISOString(); }
  return null;
}
function ensureTs(f,r){
  const T=f.timer; if(!T||!r) return false;
  r.ts = r.ts || {};
  if(!r.ts[T.start]){
    r.ts[T.start] = tsFromFields(r,T) || r.at || new Date().toISOString();
    const d=new Date(r.ts[T.start]);
    if(!r.v[T.dateField]) r.v[T.dateField]=isoDate(d);
    if(!r.v[T.timeField]) r.v[T.timeField]=isoTime(d);
    return true;
  }
  return false;
}
function migrateTs(){
  let ch=false;
  FORMS.forEach(f=>{ if(!f.timer) return; recs(f.code).forEach(r=>{ if(ensureTs(f,r)) ch=true; }); });
  if(ch) save();
}
function stampNow(f,r,key,field){
  ensureTs(f,r);
  const now=new Date();
  (r.ts ||= {})[key]=now.toISOString();
  if(field) r.v[field]=isoTime(now);
  save(); reRender();
}
function clearStamp(f,r,key,field){
  if(r.ts) delete r.ts[key];
  if(field) r.v[field]="";
  save(); reRender();
}
function elapsedMs(r,key,to){
  const a=r.ts&&r.ts[key]; if(!a) return null;
  const b=to?(r.ts&&r.ts[to]):null;
  return (b?new Date(b):new Date()) - new Date(a);
}
function fmtDur(ms){
  if(ms===null||ms===undefined||isNaN(ms)) return "—";
  const neg=ms<0; ms=Math.abs(ms);
  const s=Math.floor(ms/1000), d=Math.floor(s/86400), h=Math.floor(s%86400/3600),
        m=Math.floor(s%3600/60), sec=s%60;
  let out = d ? `${d} ${U("dd")} ${pad(h)}:${pad(m)}:${pad(sec)}` : `${pad(h)}:${pad(m)}:${pad(sec)}`;
  return (neg?"-":"")+out;
}
function fmtStamp(iso){
  if(!iso) return "—";
  const d=new Date(iso);
  return `${isoDate(d)} · ${isoTime(d)}`;
}

/* ===================== مخطط جانت للإجازات والبدلاء ===================== */
const DAY=86400000;
const pDate=s=>{ if(!s) return null; const d=new Date(String(s)+"T00:00:00"); return isNaN(d)?null:d; };
const dDiff=(a,b)=>Math.round((b-a)/DAY);
function overlapInfo(row){
  const ls=pDate(row[4]), ss=pDate(row[8]);
  if(!ls||!ss) return null;
  return dDiff(ss,ls);          /* موجب = باشر البديل قبل السفر */
}
function overlapPill(row){
  const n=overlapInfo(row);
  if(n===null) return `<span class="pill p-none">—</span>`;
  if(n>=1)  return `<span class="pill p-ok">${n} ${U("dayOv")}</span>`;
  if(n===0) return `<span class="pill p-warn">${U("noOv")}</span>`;
  return `<span class="pill p-crit">${U("lateOv")} ${Math.abs(n)}</span>`;
}
function ganttBox(f,r){
  const rows=(r.v.plan||[]).filter(x=>pDate(x[4])&&pDate(x[5]));
  if(!rows.length) return `<div class="empty">${U("gEmpty")}</div>`;
  let min=null,max=null;
  rows.forEach(x=>{
    [pDate(x[4]),pDate(x[5]),pDate(x[8]),pDate(x[9])].forEach(d=>{
      if(!d) return; if(!min||d<min) min=d; if(!max||d>max) max=d; });
  });
  min=new Date(min-3*DAY); max=new Date(+max+3*DAY);
  const total=Math.max(1,dDiff(min,max));
  const dayW=Math.max(3.2, Math.min(15, 720/total));
  const W=total*dayW;
  const pos=d=>dDiff(min,d)*dayW;

  /* شريط الشهور */
  const months=[]; let cur=new Date(min.getFullYear(),min.getMonth(),1);
  while(cur<=max){
    const next=new Date(cur.getFullYear(),cur.getMonth()+1,1);
    const s=Math.max(+min,+cur), e=Math.min(+max,+next);
    if(e>s) months.push({x:pos(new Date(s)), w:dDiff(new Date(s),new Date(e))*dayW,
      t:new Intl.DateTimeFormat(LANG==="en"?"en-GB":"ar",{month:"long",year:"numeric"}).format(cur)});
    cur=next;
  }
  const weeks=[]; let wk=new Date(min);
  while(wk<=max){ weeks.push(pos(wk)); wk=new Date(+wk+7*DAY); }
  const today=new Date(); today.setHours(0,0,0,0);
  const todayX=(today>=min&&today<=max)?pos(today):null;

  const bars=rows.map(x=>{
    const ls=pDate(x[4]), le=pDate(x[5]), ss=pDate(x[8]), se=pDate(x[9]);
    const ov=overlapInfo(x);
    const lx=pos(ls), lw=Math.max(dayW,(dDiff(ls,le)+1)*dayW);
    const sx=ss?pos(ss):null, sw=(ss&&se)?Math.max(dayW,(dDiff(ss,se)+1)*dayW):null;
    const ox=(ss&&ov>0)?pos(ss):null, ow=(ss&&ov>0)?ov*dayW:null;
    return `<div class="grow">
      <div class="glab"><b>${esc(x[0]||"—")}</b><em>${esc(tr(x[1])||"")}</em>
        <span class="gsub">${U("subL")}: ${esc(x[6]||"—")}</span>
        <span class="gov2">${overlapPill(x)}</span></div>
      <div class="gtrack" style="width:${W.toFixed(0)}px">

/* ===================== الرسوم البيانية ===================== */
function dayKey(d){ return isoDate(new Date(d)); }
function trendData(n){
  const out=[], now=new Date();
  for(let i=n-1;i>=0;i--){
    const d=new Date(now); d.setDate(now.getDate()-i); d.setHours(0,0,0,0);
    out.push({k:isoDate(d), d, n:0, c:0});
  }
  const map={}; out.forEach(o=>map[o.k]=o);
  FORMS.forEach(f=>recs(f.code).forEach(r=>{
    const a=map[dayKey(r.at)]; if(a) a.n++;
    const fin=r.ts&&r.ts.fin; if(fin){ const b=map[dayKey(fin)]; if(b) b.c++; }
  }));
  return out;
}
function chartTrend(){
  const D=trendData(14);
  const W=700,H=190,pl=30,pr=14,pt=16,pb=30;
  const max=Math.max(2,...D.map(x=>x.n+0),...D.map(x=>x.c+0));
  const bw=(W-pl-pr)/D.length, gap=4, cw=Math.max(5,(bw-gap*2)/2);
  const Y=v=>pt+(H-pt-pb)*(1-v/max);
  const ticks=[...new Set([0,Math.ceil(max/2),max])];
  const grid=ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" class="gl"/>
     <text x="${pl-7}" y="${(Y(v)+3.5).toFixed(1)}" class="gt" text-anchor="end">${v}</text>`).join("");
  const bars=D.map((p,i)=>{
    const x0=pl+bw*i+gap/2;
    const h1=Math.max(p.n?3:0,(H-pt-pb)*p.n/max), h2=Math.max(p.c?3:0,(H-pt-pb)*p.c/max);
    return `<g><title>${p.k} · ${U("cNew")} ${p.n} · ${U("cDone")} ${p.c}</title>
      <rect x="${pl+bw*i}" y="${pt}" width="${bw}" height="${H-pt-pb}" fill="transparent" class="hitr"/>
      <rect x="${(x0).toFixed(1)}" y="${(Y(p.n)).toFixed(1)}" width="${cw.toFixed(1)}" height="${h1.toFixed(1)}" rx="3" class="barN"/>
      <rect x="${(x0+cw+gap).toFixed(1)}" y="${(Y(p.c)).toFixed(1)}" width="${cw.toFixed(1)}" height="${h2.toFixed(1)}" rx="3" class="barC"/>
    </g>`;}).join("");
  const xl=D.map((p,i)=>(i%2===0||i===D.length-1)
    ?`<text x="${(pl+bw*i+bw/2).toFixed(1)}" y="${H-10}" class="gt" text-anchor="middle">${p.k.slice(5)}</text>`:"").join("");
  const tot=D.reduce((a,b)=>a+b.n,0), totC=D.reduce((a,b)=>a+b.c,0);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${U("cTrend")}">
    <line x1="${pl}" x2="${W-pr}" y1="${Y(0)}" y2="${Y(0)}" class="gb"/>
    ${grid}${bars}${xl}</svg>
  <div class="legend"><span><i style="background:var(--brand)"></i>${U("cNew")} · <b class="mono">${tot}</b></span>
    <span><i style="background:var(--ok)"></i>${U("cDone")} · <b class="mono">${totC}</b></span></div>`;
}
function chartStates(){
  const cnt={}; let tot=0;

function allRows(code,key){ const out=[]; recs(code).forEach(r=>(r.v[key]||[]).forEach(row=>out.push(row))); return out; }

function allRecs(){
  const out=[];
  FORMS.forEach(f=>recs(f.code).forEach(r=>out.push({f,r})));
  return out.sort((a,b)=>new Date(b.r.at)-new Date(a.r.at));
}
function pending(){
  const out=[];
  FORMS.forEach(f=>recs(f.code).forEach(r=>{
    const st=wfState(r);
    if((st==="sent"||st==="review"||st==="client") && r.wf && r.wf.at) out.push({f,r});
  }));
  return out.sort((a,b)=>new Date(a.r.wf.at)-new Date(b.r.wf.at));
}
function metrics(){
  const wo=recs("WO-01"), m={total:wo.length, open:0, closed:0, byCls:{"طارئ":0,"عالي":0,"متوسط":0,"منخفض":0},
    sla:{resp:{ok:0,bad:0},start:{ok:0,bad:0},fin:{ok:0,bad:0}}, respSum:0, respN:0, live:[]};
  wo.forEach(r=>{
    const c=r.v.cls, s=SLA[c]; if(c&&m.byCls[c]!==undefined) m.byCls[c]++;
    const fin=(r.ts&&r.ts.fin)||wfState(r)==="closed";
    if(fin) m.closed++; else m.open++;
    if(s){
      [["rsp","resp"],["sta","start"],["fin","fin"]].forEach(([k,t])=>{
        const el=elapsedMs(r,"reg",(r.ts&&r.ts[k])?k:null);
        if(el===null) return;
        const stamped=r.ts&&r.ts[k];
        if(!stamped && el<=s[t]*60000) return;            /* ما زال ضمن المهلة */
        if(s[t]===0) return;                              /* "فورًا" لا يُحتسب التزامًا */
        (el<=s[t]*60000 ? m.sla[t].ok++ : m.sla[t].bad++);
      });
      const er=elapsedMs(r,"reg",(r.ts&&r.ts.rsp)?"rsp":null);
      if(r.ts&&r.ts.rsp&&er!==null){ m.respSum+=er; m.respN++; }
    }
    if(!fin && r.ts&&r.ts.reg) m.live.push(r);
  });
  m.live.sort((a,b)=>new Date(a.ts.reg)-new Date(b.ts.reg));

  const risks=allRows("RSK-01","risks");
  const grid={}; let rOpen=0, rCrit=0, rHigh=0, rScored=0;
  risks.forEach(x=>{
    const l=+x[4]||0, i=+x[5]||0, st=x[10];
    if(st&&st!=="مغلق") rOpen++;
    if(l&&i){ rScored++; const sc=l*i; if(sc>=15) rCrit++; else if(sc>=9) rHigh++;
      grid[l+"_"+i]=(grid[l+"_"+i]||0)+1; }
  });
  return {wo:m, risk:{total:risks.length, open:rOpen, crit:rCrit, high:rHigh, scored:rScored, grid},
          inc:recs("HSE-03").length, ptw:recs("HSE-01").length, ncr:recs("QA-04").length,
          trn:recs("HSE-04").length};
}

  }).join("");

  $("#app").innerHTML=`
  <div class="mast">
    <div>
      <div class="eyebrow">SCE-2026-0119 · OPERATIONS DASHBOARD</div>
      <h1>${U("dashT")}</h1>
      <p>${U("dashP")}</p>
    </div>

  <div class="tiles">
    ${tile(U("tOpen"), W.open, U("tOpenS"), W.open?"warn":"")}
    ${tile(U("tClosed"), W.closed, U("tClosedS"))}
    ${tile(U("tAvgResp"), W.respN?fmtDur(Math.round(W.respSum/W.respN)):"—", U("tAvgRespS"))}
    ${tile(U("tRiskOpen"), M.risk.open, U("tRiskOpenS"))}
    ${tile(U("tRiskCrit"), M.risk.crit, U("tRiskCritS"), M.risk.crit?"crit":"")}
    ${tile(U("tPend"), pending().length, U("tPendS"), pending().length?"warn":"")}
    ${tile(U("tInc"), M.inc, U("tIncS"))}
  </div>

  <div class="dgrid">
    <section class="panel">
      <h3>${U("cWO")}<span>${W.total} ${U("rec")}</span></h3>
      <div class="hbars">${bars}</div>
      <p class="pnote">${U("cWOn")}</p>
    </section>

    <section class="panel">
      <h3>${U("cSLA")}<span>WO-01</span></h3>
      <div class="hbars">
        ${slaRow("resp",U("resp"))}
        ${slaRow("start",U("start"))}
        ${slaRow("fin",U("fin"))}
      </div>
      <p class="pnote">${U("cSLAn")}</p>
    </section>

    <section class="panel wide">
      <h3>${U("cHeat")}<span>${M.risk.scored} ${U("ofN")} ${M.risk.total}</span></h3>
      ${heat}
      <div class="legend">
        <span><i class="c-ok"></i>${esc(riskLevel(2).t)} 1–3</span>
        <span><i class="c-br"></i>${esc(riskLevel(6).t)} 4–8</span>
        <span><i class="c-warn"></i>${esc(riskLevel(10).t)} 9–14</span>
        <span><i class="c-crit"></i>${esc(riskLevel(20).t)} 15–25</span>
      </div>
      <p class="pnote">${U("cHeatn")}</p>
    </section>

    <section class="panel wide">
      <h3>${U("cTrend")}<span>14 ${U("dd")}</span></h3>
      ${chartTrend()}
      <p class="pnote">${U("cTrendn")}</p>
    </section>

    <section class="panel">
      <h3>${U("cForms")}<span>${FORMS.reduce((n,f)=>n+recs(f.code).length,0)}</span></h3>
      ${chartForms()}
    </section>

    <section class="panel">
      <h3>${U("cPend")}<span>${pending().length}</span></h3>
      ${pending().length?`<div class="tw"><table><thead><tr>
        <th>${U("formNo")}</th><th>${U("wono")}</th><th>${U("wfT")}</th><th>${U("waiting")}</th><th></th></tr></thead>
        <tbody>${pending().map(p=>`<tr>
          <td class="mono">${p.f.code}</td>
          <td>${esc(p.r.v.no||p.r.v.wo||p.r.v.ref||"—")}</td>
          <td><span class="pill p-br">${esc(pick(WF[WFI(wfState(p.r))].l,WF[WFI(wfState(p.r))].en))}</span></td>
          <td class="mono">${fmtDur(new Date()-new Date(p.r.wf.at))}</td>
          <td><button class="btn" data-openrec="${p.f.code}" data-rid="${p.r.id}">${U("open")}</button></td>
        </tr>`).join("")}</tbody></table></div>`:`<div class="empty">${U("noPend")}</div>`}
    </section>

    <section class="panel wide">
      <h3>${U("cStates")}<span>${allRecs().length}</span></h3>
      ${chartStates()}
      <p class="pnote">${U("cStatesn")}</p>
    </section>

    <section class="panel wide">
      <h3>${U("cAll")}<span>${allRecs().length}</span></h3>
      ${allRecs().length?`<div class="tw"><table><thead><tr>
        <th>${U("formNo")}</th><th>${U("wono")}</th><th>${U("codeL")}</th><th>${U("wfT")}</th>
        <th>${U("createdL")}</th><th>${U("closedL")}</th><th></th></tr></thead>
        <tbody>${allRecs().map(p=>{
          const st=wfState(p.r), i=WFI(st);
          const fin=(p.r.ts&&p.r.ts.fin)||(st==="closed"?p.r.wf.at:null);
          return `<tr>
            <td class="mono">${p.f.code}</td>
            <td>${esc(p.r.v.no||p.r.v.wo||p.r.v.ref||p.r.v.topic||"—")}</td>
            <td class="mono">${esc(recCode(p.f.code,p.r.id))}</td>
            <td><span class="pill ${st==="closed"?"p-ok":(st==="draft"?"p-none":"p-br")}">${esc(pick(WF[i].l,WF[i].en))}</span></td>
            <td class="mono">${esc(fmtStamp(p.r.at))}</td>
            <td class="mono">${fin?esc(fmtStamp(fin)):"—"}</td>
            <td><button class="btn" data-openrec="${p.f.code}" data-rid="${p.r.id}">${U("open")}</button></td>
          </tr>`;}).join("")}</tbody></table></div>`:`<div class="empty">${U("noRec")}</div>`}
    </section>

    <section class="panel wide">
      <h3>${U("cLive")}<span>${W.live.length}</span></h3>
      ${W.live.length?`<div class="tw"><table><thead><tr>
        <th>${U("wono")}</th><th>${U("locL")}</th><th>${U("clsW")}</th><th>${U("sinceReg")}</th><th></th>
      </tr></thead><tbody>${liveRows}</tbody></table></div>`:`<div class="empty">${U("noLive")}</div>`}
    </section>
  </div>`;
}

function openFromHash(){
  const m=(location.hash||"").replace("#","").split("/");
  if(m.length===2 && F(m[0])){ S.view="index"; S.cur={code:m[0], rid:m[1]}; return true; }
  return false;
}
function route(){
  if(S.view==="dash"){ dash(); return; }
  S.cur?sheet():home();
}

/* ===================== الأحداث ===================== */
document.addEventListener("input",e=>{
  const el=e.target, d=el.dataset;
  if(d.me!==undefined){ (S.me ||= {})[d.me]=el.value; try{localStorage.setItem("sce_ops_me",JSON.stringify(S.me));}catch(err){} return; }
  if(d.wfnote!==undefined){ S._wfnote=el.value; return; }
  if(d.base!==undefined){ S.base=el.value; save(); return; }
  if(d.findcode!==undefined){ S._find=el.value; return; }
  const c=cur(); if(!c||!c.r) return;
  const r=c.r;
  if(d.rk!==undefined){
    (r.v[d.rk] ||= [])[+d.ri][+d.ci]=el.value; save();
    if(el.closest("tr")&&(el.tagName==="SELECT"||el.type==="date")){ reRender(); }
    return;
  }
  if(d.k!==undefined){
    if(el.type==="checkbox"){
      const fl=findField(c.f,d.k), on=new Set(r.v[d.k]||[]);
      el.checked?on.add(fl.o[+d.ci]):on.delete(fl.o[+d.ci]);
      r.v[d.k]=fl.o.filter(o=>on.has(o));
    } else r.v[d.k]=el.value;
    const T=c.f.timer;
    if(T && (d.k===T.dateField || d.k===T.timeField)){
      const n=tsFromFields(r,T); if(n){ r.ts=r.ts||{}; r.ts[T.start]=n; }
    }
    save();
    return;
  }
});
document.addEventListener("change",e=>{
  const el=e.target, d=el.dataset, c=cur(); if(!c||!c.r) return;
  if(el.id==="recpick"){ S.cur.rid=el.value; render(); return; }
  if(d.k!==undefined && (el.tagName==="SELECT"||el.type==="time")){ reRender(); }
});
function findField(f,k){ let out=null; f.secs.forEach(s=>(s.f||[]).forEach(fl=>{ if(fl.k===k) out=fl; })); return out; }

document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  const d=b.dataset;
  if(d.open){ S.view="index"; S.cur={code:d.open, rid:(recs(d.open)[0]||{}).id}; if(!recs(d.open).length) newRec(d.open); else render(); return; }
  if(d.openrec){ S.view="index"; S.cur={code:d.openrec, rid:d.rid}; render(); return; }
  if(d.home!==undefined){ S.view="index"; S.cur=null; render(); return; }
  if(d.new){ newRec(d.new); return; }
  if(d.del){
    const c=cur(); if(!c) return;
    const list=recs(c.f.code), i=list.findIndex(x=>x.id===d.del);
    if(i>=0 && confirm(U("confirmDel"))){ list.splice(i,1); S.cur.rid=(list[0]||{}).id; save(); render(); }
    return;
  }
  if(d.wf){ const c=cur(); if(c&&c.r) wfMove(c.f,c.r,d.wf); return; }
  if(d.wflink!==undefined){ S._wflink=!S._wflink; reRender(); return; }
  if(d.wfcopycode!==undefined){
    const c=cur(); if(!c||!c.r) return;
    copyText(recCode(c.f.code,c.r.id), b, U("copyCode")); return;
  }
  if(d.gocode!==undefined){
    const hit=findByCode(S._find); 
    if(hit){ S.view="index"; S.cur=hit; S._find=""; render(); }
    else { S._findErr=true; reRender(); }
    return;
  }
  if(d.wfcopy!==undefined||d.wfcopymsg!==undefined){
    const el=$(d.wfcopy!==undefined?"#wfLinkIn":"#wfMsg"); if(!el) return;
    el.select();
    try{ navigator.clipboard?navigator.clipboard.writeText(el.value):document.execCommand("copy"); }
    catch(e){ try{document.execCommand("copy");}catch(e2){} }
    b.textContent=U("copied"); setTimeout(()=>{b.textContent=d.wfcopy!==undefined?U("copy"):U("copyMsg");},1400);
    return;
  }
  if(d.stamp){ const c=cur(); if(c&&c.r) stampNow(c.f,c.r,d.stamp,d.fld); return; }
  if(d.unstamp){ const c=cur(); if(c&&c.r) clearStamp(c.f,c.r,d.unstamp,d.fld); return; }
  if(d.resetts!==undefined){
    const c=cur(); if(!c||!c.r||!c.f.timer) return;
    const T=c.f.timer, now=new Date();
    c.r.ts={}; c.r.ts[T.start]=now.toISOString();
    c.r.v[T.dateField]=isoDate(now); c.r.v[T.timeField]=isoTime(now);
    T.steps.forEach(s=>{ if(s.field) c.r.v[s.field]=""; });
    save(); reRender(); return;
  }
  if(d.addrow){
    const c=cur(); if(!c||!c.r) return;
    const fl=findField(c.f,d.addrow);
    (c.r.v[d.addrow] ||= []).push(fl.cols.map(()=>"")); save(); reRender(); return;
  }
  if(d.delrow){
    const c=cur(); if(!c||!c.r) return;
    (c.r.v[d.delrow]||[]).splice(+d.ri,1); save(); reRender(); return;
  }
  if(d.print!==undefined){ window.print(); return; }
  if(d.json!==undefined){
    const c=cur(); if(!c||!c.r) return;
    offer(`${c.f.code}-${(c.r.v.no||c.r.v.wo||"record")}.json`,
      JSON.stringify({form:c.f.code, name:c.f.name, tender:TENDER, data:c.r.v},null,2));
    return;
  }
  if(b.id==="btnHome"){ S.view="index"; S.cur=null; render(); return; }
  if(b.id==="btnDash"){ S.view="dash"; S.cur=null; render(); return; }
  if(b.id==="btnLang"){ setLang(LANG==="ar"?"en":"ar"); return; }
  if(b.id==="btnTheme"){
    const cu=document.documentElement.getAttribute("data-theme");
    const nx=cu==="dark"?"light":(cu==="light"?"dark":(matchMedia("(prefers-color-scheme: dark)").matches?"light":"dark"));
    document.documentElement.setAttribute("data-theme",nx);
    try{localStorage.setItem("sce_ops_theme",nx);}catch(err){}
    return;
  }
});

function copyText(txt, btn, back){
  try{
    if(navigator.clipboard) navigator.clipboard.writeText(txt);
    else { const t=document.createElement("textarea"); t.value=txt; document.body.appendChild(t);
           t.select(); document.execCommand("copy"); t.remove(); }
  }catch(e){}
  if(btn){ const o=btn.textContent; btn.textContent=U("copied"); setTimeout(()=>btn.textContent=back||o,1400); }
}
async function offer(filename,data){
  if(DL){ try{ await DL.save({filename,data}); return; }catch(err){ if(err&&err.code==="declined") return; } }
  try{ const bl=new Blob([data],{type:"application/json"}); const a=document.createElement("a");
    a.href=URL.createObjectURL(bl); a.download=filename; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }catch(e){ alert(U("noDl")); }
}

/* ===================== الإقلاع ===================== */
(function boot(){
  try{ const t=localStorage.getItem("sce_ops_theme"); if(t) document.documentElement.setAttribute("data-theme",t); }catch(e){}
  try{ const l=localStorage.getItem("sce_ops_lang"); if(l==="en"||l==="ar") LANG=l; }catch(e){}
  try{ const me=localStorage.getItem("sce_ops_me"); if(me) S.me=JSON.parse(me); }catch(e){}
  try{ const raw=localStorage.getItem("sce_ops_forms_v1"); if(raw){ const o=JSON.parse(raw); if(o&&o.rec) S={...S,...o,cur:null}; } }catch(e){}
  migrateTs();
  openFromHash();
  render(); chip("off",U("savedLocal"));
  window.addEventListener("hashchange",()=>{ if(openFromHash()) render(); });
  const cap=n=>(window.claude&&typeof claude.use==="function")?claude.use(n):Promise.resolve(null);
  cap("db").then(async db=>{
    if(!db) return; DB=db; chip("",U("savedTeam"));
    try{
      const sn=await DB.doc(DOC).get();
      if(sn.exists&&sn.data()&&sn.data().payload){
        const o=JSON.parse(sn.data().payload); if(o&&o.rec){ S={...S,...o,cur:S.cur}; migrateTs(); reRender(); }
      }
      DB.doc(DOC).onSnapshot(s2=>{
        if(!s2.exists) return;
        const a=document.activeElement;
        if(a&&["INPUT","TEXTAREA","SELECT"].includes(a.tagName)) return;
        const dd=s2.data(); if(!dd||!dd.payload) return;
        const o=JSON.parse(dd.payload);
        if(JSON.stringify(o.rec)!==JSON.stringify(S.rec)){ S={...S,...o,cur:S.cur}; migrateTs(); reRender(); }
      },()=>{});
    }catch(e){}
  }).catch(()=>{});
  cap("downloads").then(dl=>{ if(dl) DL=dl; }).catch(()=>{});
})();
</script>
