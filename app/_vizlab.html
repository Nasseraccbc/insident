<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مختبر الرسوم</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/charts.css">
</head>
<body>
<div class="main"><div class="page stack" id="p"></div></div>
<script type="module">
import { el } from "./js/ui.js";
import { lineChart, stackedBar, barsH, riskMatrix, meter, legend, tableTwin, SERIES, ORD } from "./js/charts.js";

const p = document.getElementById("p");
const card = (t, sub, host, leg, twin) => el("section", { class: "card viz-card" },
  el("div", { class: "card-head" }, el("div", { class: "grow" },
    el("h3", { text: t }), el("div", { class: "tiny dim", text: sub }))),
  el("div", { class: "card-body" }, leg, host, twin));

/* بيانات وهمية للمعاينة فقط — لا تمسّ القاعدة */
const xs = [], created = [], closed = [];
for (let i = 13; i >= 0; i--) {
  const d = new Date(Date.now() - i * 864e5);
  xs.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`);
  created.push(3 + Math.round(6 * Math.abs(Math.sin(i * 0.9))));
  closed.push(2 + Math.round(5 * Math.abs(Math.cos(i * 0.7))));
}
const fmtDay = (k) => { const [, m, d] = k.split("-"); return `${+d}/${+m}`; };

const hero = el("div", { class: "card hero-card" }, el("div", { class: "card-body" },
  el("div", { class: "stat-label", text: "الالتزام بمهلة الإغلاق" }),
  el("div", { class: "hero-num warn", text: "82%" }),
  meter(82, "warn"),
  el("div", { class: "tiny dim mt-2", text: "41 من 50 سجلًا أُغلق داخل المهلة" })));

const h1 = el("div", { class: "viz-host" });
const series = [
  { label: "سجلات أُنشئت", color: SERIES[0], v: created },
  { label: "سجلات أُغلقت", color: SERIES[1], v: closed },
];

const states = ["مسودة","مُرسل للمشرف","قيد المراجعة","معتمد داخليًا","مرفوع للهيئة","مغلق ومعتمد"];
const vals = [8, 5, 4, 3, 2, 21];
const parts = states.map((label, i) => ({ label, value: vals[i], color: ORD(i + 1) }));
const h2 = el("div", { class: "viz-host" });

const forms = [
  { label: "WO-01 · أمر عمل وبلاغ", value: 24 },
  { label: "QA-02-EL · الفحص الشامل للأصول الكهربائية", value: 17 },
  { label: "HS-01 · طلب ضيافة للمكاتب", value: 12 },
  { label: "MR-01 · تجهيز قاعات الاجتماعات", value: 9 },
  { label: "HSE-03 · بلاغ حادث", value: 4 },
];
const h3 = el("div", { class: "viz-host" });

const cells = [
  [0,1,0,0,0],
  [1,2,1,0,0],
  [0,1,3,2,1],
  [0,0,2,4,2],
  [0,0,1,2,3],
];
const h4 = el("div", { class: "viz-host" });

p.append(
  hero,
  card("حركة السجلات", "14 يومًا — ما دخل مقابل ما أُغلق", h1,
       legend(series.map((s) => ({ label: s.label, color: s.color })), { line: true }),
       tableTwin(["اليوم", ...series.map((s) => s.label)], xs.map((k, i) => [fmtDay(k), created[i], closed[i]]))),
  card("أين تقف السجلات", "مراحل الاعتماد الست بالترتيب", h2,
       legend(parts), tableTwin(["المرحلة","العدد"], parts.map((x) => [x.label, x.value]))),
  el("div", { class: "grid-2" },
    card("أكثر النماذج استخدامًا", "عدد السجلات لكل نموذج", h3, null,
         tableTwin(["النموذج","سجلات"], forms.map((f) => [f.label, f.value]))),
    card("خريطة المخاطر", "الاحتمالية (عمودي) × الأثر (أفقي) — الإطار الأحمر منطقة التصعيد (الدرجة ١٥ فأعلى)", h4, null,
         tableTwin(["الاحتمالية","الأثر","الدرجة","مخاطر"],
           cells.flatMap((row, i) => row.map((v, j) => [i+1, j+1, (i+1)*(j+1), v])).filter((r) => r[3])))
  )
);

lineChart(h1, { xs, series, fmtX: fmtDay });
stackedBar(h2, { parts });
barsH(h3, { items: forms });
riskMatrix(h4, { cells });
</script>
</body>
</html>
